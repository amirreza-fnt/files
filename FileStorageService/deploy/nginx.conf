# File Storage Service - Reverse Proxy + Static Cache
# storage.sabzevar.ir (public) and f.sabzevar.ir (short links) -> Kestrel on 127.0.0.1:6000

# Global tuning
worker_processes auto;
worker_rlimit_nofile 65536;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time cache:$upstream_cache_status';

    access_log /var/log/nginx/filestorage-access.log main;
    error_log  /var/log/nginx/filestorage-error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # --- Proxy cache used ONLY for /c/ static files ---
    proxy_cache_path /var/cache/nginx/filestorage levels=1:2 keys_zone=static_cache:100m
                     max_size=10g inactive=7d use_temp_path=off;

    upstream filestorage {
        server 127.0.0.1:6000;
        keepalive 64;
    }

    # ======================================================================
    # storage.sabzevar.ir — main host
    # ======================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name storage.sabzevar.ir;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name storage.sabzevar.ir;

        ssl_certificate     /etc/letsencrypt/live/storage.sabzevar.ir/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/storage.sabzevar.ir/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Uploads can be large — Nginx limit (mirrors Kestrel 1GB ceiling)
        client_max_body_size 1024m;
        client_body_timeout 300s;

        # Long uploads should not be buffered to disk unboundedly
        client_body_buffer_size 16k;

        # ---- Static files (/c/) served from the Nginx proxy cache ----
        location /c/ {
            proxy_cache static_cache;
            proxy_cache_key "$scheme$host$request_uri";
            proxy_cache_valid 200 206 304 7d;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://filestorage;
        }

        # ---- Everything else proxies straight to Kestrel ----
        location / {
            proxy_pass http://filestorage;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
